# AMEVA-STT-Trainer 학습 설정
# 이 파일을 수정하면 src/core/config.py의 기본값이 덮어씌워진다.

# ---- 데이터 수집 ----
channel_url: "https://www.youtube.com/@syukaworld/videos"
max_videos: 30
sample_rate: 16000
max_chunk_duration_ms: 25000
min_chunk_duration_ms: 3000
audio_padding_ms: 100

# ---- 학습 ----
model_id: "openai/whisper-tiny"
language: "Korean"
task: "transcribe"
batch_size: 2
gradient_accumulation: 8
learning_rate: 0.001
max_steps: 1000
save_steps: 50
logging_steps: 10
warmup_steps: 50

# ---- LoRA ----
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05

# ---- 평가 ----
eval_samples: 50

# ---- WandB (Weights & Biases) ----
wandb:
  enabled: true
  project: "AMEVA-STT-Trainer"
  mode: "online"  # "online" or "offline" (offline 시 wandb sync 필요)
  log_artifacts: true
